apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: e2e-testing-agent
  version: 1.0.0

agentCard:
  name: E2E Testing Agent
  version: 1.0.0
  description: A hello world E2E testing agent that accepts a test task and returns a structured result.

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: e2e-testing-agent
      kind: a2a
      ordId: customer.build:apiResource:e2e-testing-agent-80838.e2e-testing-agent:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
